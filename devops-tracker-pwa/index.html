<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps in 3 Months — Progress Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e0f;
    --surface:#12181a;
    --surface-2:#161d1f;
    --border:#22302f;
    --border-soft:#1a2426;
    --text:#dbe4e1;
    --text-dim:#7c8f8a;
    --text-faint:#4d5c58;
    --green:#3ddc84;
    --green-dim:#1e5e3f;
    --amber:#ffb84d;
    --amber-dim:#6b4d1a;
    --coral:#f0997b;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:32px 20px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
    font-family:var(--mono);
  }
  .top h1{
    font-size:15px;
    font-weight:500;
    margin:0;
    color:var(--text);
    letter-spacing:0.02em;
  }
  .top .pct{
    font-size:15px;
    color:var(--green);
    font-weight:700;
  }
  .sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    margin-bottom:20px;
  }
  .pipeline{
    display:flex;
    align-items:center;
    margin:24px 0 28px;
    overflow-x:auto;
    padding-bottom:6px;
  }
  .node{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    flex-shrink:0;
    width:78px;
  }
  .dot{
    width:15px;height:15px;border-radius:50%;
    background:var(--surface-2);
    border:2px solid var(--border);
    transition:all .15s ease;
  }
  .dot.amber{background:var(--amber-dim);border-color:var(--amber);}
  .dot.green{background:var(--green);border-color:var(--green);}
  .node-label{
    font-family:var(--mono);
    font-size:9.5px;
    color:var(--text-faint);
    text-align:center;
    line-height:1.3;
  }
  .node:hover .node-label{color:var(--text-dim);}
  .line{
    height:2px;
    background:var(--border);
    flex:1;
    min-width:14px;
    margin-top:-19px;
  }
  .line.done{background:var(--green-dim);}
  .barwrap{
    height:6px;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:32px;
  }
  .barfill{
    height:100%;
    background:var(--green);
    width:0%;
    transition:width .3s ease;
  }
  .stage{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:8px;
    margin-bottom:16px;
    overflow:hidden;
    scroll-margin-top:20px;
  }
  .stage-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
  }
  .stage-dots{display:flex;gap:5px;}
  .stage-dots span{width:8px;height:8px;border-radius:50%;background:var(--border);}
  .stage-title{
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    flex:1;
  }
  .stage-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
  }
  .chev{
    color:var(--text-faint);
    font-size:11px;
    transition:transform .15s ease;
  }
  .stage.collapsed .chev{transform:rotate(-90deg);}
  .items{padding:6px 8px;}
  .stage.collapsed .items{display:none;}
  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 10px;
    border-radius:5px;
    cursor:pointer;
  }
  .item:hover{background:var(--surface-2);}
  .box{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-faint);
    line-height:1.5;
    flex-shrink:0;
    width:16px;
  }
  .item.done .box{color:var(--green);}
  .item-text{
    font-size:13.5px;
    line-height:1.5;
    color:var(--text);
  }
  .item.done .item-text{color:var(--text-faint);text-decoration:line-through;}
  .tag{
    font-family:var(--mono);
    font-size:9px;
    color:var(--coral);
    border:1px solid #4a3226;
    background:#1c1310;
    padding:1px 5px;
    border-radius:3px;
    margin-left:8px;
    vertical-align:1px;
  }
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-faint);
  }
  .reset{
    background:none;
    border:1px solid var(--border);
    color:var(--text-faint);
    font-family:var(--mono);
    font-size:10.5px;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
  }
  .reset:hover{color:var(--coral);border-color:#4a3226;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>sulthan@devops:~$ ./tracker</h1>
    <span class="pct" id="pctLabel">0%</span>
  </div>
  <div class="sub">course progress tracker · built for Sulthan Basha Mulla</div>

  <div class="pipeline" id="pipeline"></div>
  <div class="barwrap"><div class="barfill" id="barfill"></div></div>

  <div id="stages"></div>

  <div class="footer">
    <span id="statusLine">loading…</span>
    <button class="reset" id="resetBtn">reset all</button>
  </div>
</div>

const STORAGE_KEY = "devops-3mo-tracker-state";
let state = {};

function itemKey(sIdx, iIdx){ return sIdx + "-" + iIdx; }

function render(){
  const pipeline = document.getElementById("pipeline");
  const stagesEl = document.getElementById("stages");
  pipeline.innerHTML = "";
  stagesEl.innerHTML = "";

  let totalItems = 0, totalDone = 0;

  DATA.forEach((stage, sIdx) => {
    const total = stage.items.length;
    let done = 0;
    stage.items.forEach((_, iIdx) => { if(state[itemKey(sIdx,iIdx)]) done++; });
    totalItems += total; totalDone += done;

    const node = document.createElement("div");
    node.className = "node";
    const dotClass = done === 0 ? "" : (done === total ? "green" : "amber");
    node.innerHTML = '<div class="dot ' + dotClass + '"></div><div class="node-label">' + stage.label + '</div>';
    node.onclick = () => {
      document.getElementById("stage-" + stage.id).scrollIntoView({behavior:"smooth", block:"start"});
    };
    pipeline.appendChild(node);
    if(sIdx < DATA.length - 1){
      const line = document.createElement("div");
      line.className = "line" + (done === total ? " done" : "");
      pipeline.appendChild(line);
    }

    const stageEl = document.createElement("div");
    stageEl.className = "stage";
    stageEl.id = "stage-" + stage.id;

    const head = document.createElement("div");
    head.className = "stage-head";
    const optBadge = stage.core ? "" : '<span class="tag">optional</span>';
    head.innerHTML =
      '<div class="stage-dots"><span></span><span></span><span></span></div>' +
      '<div class="stage-title">' + stage.title + optBadge + '</div>' +
      '<div class="stage-count">' + done + '/' + total + '</div>' +
      '<div class="chev">▾</div>';
    head.onclick = () => { stageEl.classList.toggle("collapsed"); };
    stageEl.appendChild(head);

    const itemsEl = document.createElement("div");
    itemsEl.className = "items";
    stage.items.forEach((text, iIdx) => {
      const key = itemKey(sIdx, iIdx);
      const isDone = !!state[key];
      const row = document.createElement("div");
      row.className = "item" + (isDone ? " done" : "");
      const applyTag = text.startsWith("Apply:") ? '<span class="tag">apply</span>' : "";
      row.innerHTML =
        '<span class="box">' + (isDone ? "[x]" : "[ ]") + '</span>' +
        '<span class="item-text">' + text.replace(/^Apply: /,"") + applyTag + '</span>';
      row.onclick = async () => {
        state[key] = !state[key];
        render();
        try{
          await window.storage.set(STORAGE_KEY, JSON.stringify(state));
        }catch(e){ console.error("save failed", e); }
      };
      itemsEl.appendChild(row);
    });
    stageEl.appendChild(itemsEl);
    stagesEl.appendChild(stageEl);
  });

  const pct = totalItems ? Math.round((totalDone / totalItems) * 100) : 0;
  document.getElementById("pctLabel").textContent = pct + "%";
  document.getElementById("barfill").style.width = pct + "%";
  document.getElementById("statusLine").textContent = totalDone + " / " + totalItems + " tasks complete";
}

async function init(){
  try{
    const result = await window.storage.get(STORAGE_KEY);
    if(result && result.value){
      state = JSON.parse(result.value);
    }
  }catch(e){
    state = {};
  }
  render();
}

document.getElementById("resetBtn").onclick = async () => {
  state = {};
  render();
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error("reset save failed", e); }
};

init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW registration failed", e));
  });
}
</script>
